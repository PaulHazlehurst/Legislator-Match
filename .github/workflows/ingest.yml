name: Data ingest

# Run manually from the Actions tab. No local machine needed.
#
# First-time v2 upgrade:
#   1. Run ingest/sql/v2_migration.sql in the Supabase SQL editor.
#   2. Run this workflow with step = reclassify-all.
#   3. Optional: step = ai-review-eval (measures AI review on the hand-labelled
#      bills, writes nothing), then step = ai-review if it helps.
on:
  # PAUSED until session starts. Uncomment the two lines below to resume the
  # weekly automatic refresh (Sundays 06:00 UTC) that keeps bill statuses current.
  # schedule:
  #   - cron: '0 6 * * 0'
  workflow_dispatch:
    inputs:
      step:
        description: 'Which step to run'
        required: true
        default: 'reclassify-all'
        type: choice
        options:
          - reclassify-all     # seed taxonomy v2 + re-classify every bill (free, minutes)
          - ai-review-eval     # measure AI review against the gold set (no DB writes)
          - ai-review          # AI second opinion on medium/low-confidence bills
          - ingest             # pull the sessions (classifies new bills, refreshes statuses)
          - seed               # load state + taxonomy only
          - enrich             # OpenStates committees + leadership + roster
          - relink             # repair roster + sponsorships (keeps bills/topics)
          - seed+ingest        # seed then ingest, in one run
      years:
        description: 'Years (comma-separated)'
        required: false
        default: '2024,2025,2026'

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    defaults:
      run:
        working-directory: ingest
    env:
      SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      LEGISCAN_API_KEY:     ${{ secrets.LEGISCAN_API_KEY }}
      ANTHROPIC_API_KEY:    ${{ secrets.ANTHROPIC_API_KEY }}
      GEMINI_API_KEY:       ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL:         ${{ secrets.GEMINI_MODEL }}
      OPENSTATES_API_KEY:   ${{ secrets.OPENSTATES_API_KEY }}
      STATE: MD
      YEARS: ${{ inputs.years || '2024,2025,2026' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Classifier accuracy check
        run: npm run eval && npm test

      - name: Seed taxonomy
        if: ${{ inputs.step == 'seed' || inputs.step == 'seed+ingest' }}
        run: npm run seed

      - name: Ingest sessions
        if: ${{ github.event_name == 'schedule' || inputs.step == 'ingest' || inputs.step == 'seed+ingest' }}
        run: npm run ingest

      - name: Reclassify every bill (rules v2)
        if: ${{ inputs.step == 'reclassify-all' }}
        run: npm run reclassify-all

      - name: Measure AI review (no writes)
        if: ${{ inputs.step == 'ai-review-eval' }}
        run: npm run ai-review -- --eval

      - name: AI review of uncertain bills
        if: ${{ inputs.step == 'ai-review' }}
        run: npm run ai-review

      - name: Enrich (OpenStates committees + leadership)
        if: ${{ inputs.step == 'enrich' }}
        run: npm run enrich

      - name: Repair roster + sponsorships (relink)
        if: ${{ inputs.step == 'relink' }}
        run: npm run relink
